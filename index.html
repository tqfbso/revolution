<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Revolution</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #9db4c4;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        user-select: none;
        -webkit-user-select: none;
      }
      #game {
        display: block;
        width: 100vw;
        height: 100vh;
        cursor: crosshair;
      }
      .panel {
        position: fixed;
        background: rgba(12, 16, 20, 0.72);
        color: #e6edf3;
        font-size: 12px;
        line-height: 1.5;
        padding: 8px 12px;
        border-radius: 6px;
        pointer-events: none;
      }
      #perf {
        top: 10px;
        left: 10px;
        margin: 0;
        min-width: 250px;
      }
      #help {
        bottom: 10px;
        left: 10px;
        color: #b9c4cf;
      }
      #actions {
        position: fixed;
        top: 10px;
        right: 10px;
        display: flex;
        gap: 8px;
      }
      button {
        font: inherit;
        font-size: 12px;
        color: #e6edf3;
        background: rgba(12, 16, 20, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 6px;
        padding: 7px 12px;
        cursor: pointer;
      }
      button:hover {
        background: rgba(40, 52, 64, 0.9);
      }
      #select-box {
        position: fixed;
        display: none;
        border: 1px solid #7dff8a;
        background: rgba(125, 255, 138, 0.12);
        pointer-events: none;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #0c1014;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <pre id="perf" class="panel">starting…</pre>
    <div id="actions">
      <button id="add-units">+1000 units</button>
      <button id="reset">Reset</button>
    </div>
    <div id="help" class="panel">
      Drag: select · Shift: add · Ctrl+A: select all · Right click: attack-move · Alt+right click:
      move · X: stop · Esc: clear<br />
      WASD / arrows / screen edge: pan · Wheel: zoom · Q/E or middle drag: rotate
    </div>
    <div id="select-box"></div>
    <div id="loading">Loading Revolution…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
